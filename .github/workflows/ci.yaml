name: CI Build

# Controls when the action will run. Triggers the workflow on pushed tags
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "*"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The lowest supported runtime plus the version used for releases
        node: [20, 22]
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

      # Set up Node
    - name: Use Node ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

      # Run install dependencies
    - name: Install dependencies
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      run: npm ci

      # Fork PRs can change package.json, so their lifecycle scripts (prepare -> husky)
      # are untrusted: install without running them.
    - name: Install dependencies (fork PR, scripts disabled)
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      run: npm ci --ignore-scripts

      # Lint
    - name: Lint
      run: npm run lint

      # Build
    - name: Build
      run: npm run prepublish

    - name: Test
      run: npm test

    - name: Test packaging
      run: npm run package
