name: Release to NPM

# Controls when the action will run. Triggers the workflow on pushed tags
on:
  push:
    tags:
      - '*'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# Default to least privilege; jobs opt in to the extra permissions they need
permissions:
  contents: read

jobs:
  # Build and validate the package, then hand the build output to the publish job
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

      # Set up Node. Node 22 is only the release toolchain: the published
      # package itself supports Node.js >= 20 (see package.json engines)
    - name: Use Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'

      # Run install dependencies
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run prepublish

    - name: Test
      run: npm test

      # Share the built package with the publish job
    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: lib
        path: lib

  # Publish to npm using trusted publishing (OIDC).
  # Only this job gets id-token: write; no other job can mint the npm identity.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@v4

      # npm 12 requires Node.js >= 22.22.2, hence the pinned patch version
    - name: Use Node 22.22.2
      uses: actions/setup-node@v4
      with:
        node-version: 22.22.2
        registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1; pin an exact, vetted version
    - name: Use npm 12.2.1
      run: npm install npm@12.2.1 -g

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: lib
        path: lib

      # Scripts are disabled: the package was already built and tested by the build job
    - name: Publish to npm
      run: npm publish --access public --ignore-scripts

  # Create the GitHub release once the package is published
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for changelog generation

    - name: Get previous tag
      id: get_previous_tag
      run: |
        # Get the previous tag (excluding the current one)
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
        echo "Previous tag: $PREVIOUS_TAG"

      # Generate changelog for the release
    - name: Build Changelog
      id: build_changelog
      uses: mikepenz/release-changelog-builder-action@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        configuration: ".github/changelog-config.json"
        fromTag: ${{ steps.get_previous_tag.outputs.tag }}
        toTag: ${{ github.ref_name }}
        ignorePreReleases: true

      # Create GitHub Release
    - name: Create GitHub Release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## What's Changed
          ${{ steps.build_changelog.outputs.changelog }}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.get_previous_tag.outputs.tag }}...${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
